baseURL = "https://MohQaDev.github.io/"
languageCode = "en-us"
title = "Mohammad Al Qadi"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Mohammad Al Qadi"
  description = "Computer Science student & full-stack developer — portfolio, projects, and CV."
  keywords = ["Portfolio", "Mohammad Al Qadi", "Flutter", "Dart", "Full-stack"]
  author = "Mohammad Al Qadi"
  DateFormat = "January 2, 2006"
  defaultTheme = "dark"
  disableThemeToggle = false
  # Empty so the home page doesn't auto-list every page — featured projects are
  # written into the homeInfoParams Content below instead.
  mainSections = []

  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "Hi, I'm Mohammad 👋"
    Content = """
<p style="text-align:center;margin:0 0 1.5rem 0;"><img src="/img/avatar.jpeg" alt="Mohammad Al Qadi" style="width:180px;height:180px;border-radius:50%;object-fit:cover;border:3px solid var(--border);"></p>

Final-year **Computer Science** student at **Princess Sumaya University of Technology** (PSUT), Amman. I build full-stack applications across mobile, backend, and database layers — comfortable taking a project from schema design to deployment.

I'm most at home with **Flutter / Dart**, **Node / NestJS**, and **PostgreSQL**, daily-drive **Linux**, and pick up new stacks quickly.

📄 [Download my CV](/MohammadAlQadi_CV.pdf) &nbsp;•&nbsp; ✉️ [mohqa.dev@outlook.com](mailto:mohqa.dev@outlook.com) &nbsp;•&nbsp; 📍 Amman, Jordan

---

### Featured projects

#### 🩸 [JoBlood — Open-Source Blood Bank System](/projects/joblood/)
A full-stack, multi-role blood bank management system built with **Flutter + Shelf/Dart + PostgreSQL**. Four user roles (Donor, Lab Staff, Lab Manager, Admin), live temperature monitoring, bilingual EN/AR UI, Firebase auth & push notifications. Shipped as my university final-year project. → [Read more](/projects/joblood/)

#### 🛡️ [ISS Dashboard — Mobile SOC for Linux](/projects/iss/)
A Flutter app that turns your phone into a live Security Operations Center for a Linux server. One codebase, two modes (Host on Linux / Client over SSH), and 8 panels covering network traffic, journals, Fail2Ban, firewall, a ransomware detector, services, Lynis/Nmap, and a terminal. → [Read more](/projects/iss/)

See **[all projects →](/projects/)** &nbsp;or learn more **[about me →](/about/)**
"""

